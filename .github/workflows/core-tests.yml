name: Shared image core tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pillow
      - run: g++ -O3 -std=c++17 -fopenmp -shared -fPIC tests/reference.cpp -o tests/reference.so
      - run: OMP_NUM_THREADS=2 python tests/test_core.py
      - run: g++ -O3 -std=c++17 -fopenmp -shared -fPIC -DROMAN_BASELINE tests/reference.cpp -o tests/baseline.so
      - run: OMP_NUM_THREADS=2 python tests/compare_optimization.py
